---
# Kubernetes Node Tooling: kubeadm, kubelet, kubectl

- name: Create keyrings directory for Kubernetes repository
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Download Kubernetes official GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Add Kubernetes official apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    state: present
    filename: kubernetes
  when: ansible_os_family == "Debian"

- name: Install kubelet, kubeadm, and kubectl
  ansible.builtin.package:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: Prevent automatic package upgrades from breaking Kubernetes binaries
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  when: ansible_os_family == "Debian"

- name: Ensure kubelet service is enabled and started
  ansible.builtin.service:
    name: kubelet
    state: started
    enabled: yes
