---
# System and SSH Security Hardening

- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy SSH security hardening configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      # Production SSH Hardening Policy
      PermitRootLogin {{ permit_root_login }}
      PasswordAuthentication {{ password_authentication }}
      PermitEmptyPasswords no
      MaxAuthTries {{ max_auth_tries }}
      ClientAliveInterval {{ client_alive_interval }}
      ClientAliveCountMax {{ client_alive_count_max }}
      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding yes
    owner: root
    group: root
    mode: '0600'
  notify: restart sshd

- name: Configure system-wide file descriptor and process limits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-k8s.conf
    content: |
      *       soft    nofile      1048576
      *       hard    nofile      1048576
      *       soft    nproc       65536
      *       hard    nproc       65536
      root    soft    nofile      1048576
      root    hard    nofile      1048576
    owner: root
    group: root
    mode: '0644'

- name: Configure default strict umask for new files
  ansible.builtin.copy:
    dest: /etc/profile.d/umask.sh
    content: |
      # Enforce strict umask for platform security
      umask 027
    owner: root
    group: root
    mode: '0644'
