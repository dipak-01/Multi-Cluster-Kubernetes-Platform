# Resilix Infrastructure Inventory
# Supports local VMs, bare-metal nodes, and cloud instances

[k8s_control_plane]
cp-01 ansible_host=192.168.49.2 node_role=control-plane

[k8s_workers]
worker-01 ansible_host=192.168.49.10 node_role=worker
worker-02 ansible_host=192.168.49.11 node_role=worker

[k8s_cluster:children]
k8s_control_plane
k8s_workers

[monitoring]
cp-01
worker-01
worker-02

# Local runner for dry-run and local validation tests
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
