[defaults]
inventory = inventory/hosts.ini:ansible/inventory/hosts.ini
roles_path = roles:ansible/roles:../roles
remote_user = ubuntu
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
forks = 10
timeout = 30
gathering = smart
fact_caching = memory
deprecation_warnings = False

[callback_default]
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
