name: Deploy Application

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Pull latest changes and redeploy
      run: |
        cd ~/software/Multi-Cluster-Kubernetes-Platform
        git pull origin main
        docker compose up -d --build
