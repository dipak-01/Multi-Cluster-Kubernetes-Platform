name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Charts
        run: |
          helm lint helm/api
          helm lint helm/frontend

      - name: Validate Helm Template Rendering
        run: |
          helm template api helm/api -f helm/api/values-production.yaml > /dev/null
          helm template frontend helm/frontend -f helm/frontend/values-production.yaml > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./applications/api
          push: false
          tags: platform-api:test

      - name: Build Frontend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./applications/frontend
          push: false
          tags: platform-frontend:test
